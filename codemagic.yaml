# Codemagic CI/CD configuration for ABIDLIFE Flutter (Android only)
# Docs: https://docs.codemagic.io/yaml/yaml-getting-started/

workflows:
  android-apk:
    name: ABIDLIFE Android APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      groups:
        - abidlife_credentials
      flutter: stable
      vars:
        PACKAGE_NAME: "com.abidlife.app"
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: source
        - pattern: master
          include: source
        - pattern: develop
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Flutter version
        script: |
          flutter --version
      - name: Disable analytics
        script: |
          flutter --disable-analytics
      - name: Clean previous build artifacts
        script: |
          flutter clean
      - name: Fetch dependencies
        script: |
          flutter pub get
      - name: Verify Dart analysis (warnings are non-fatal)
        script: |
          flutter analyze || true
      - name: Run unit tests (optional, non-fatal)
        script: |
          flutter test || true
      - name: Build APK (debug + release)
        script: |
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - flutter_*.log
    publishing:
      email:
        recipients:
          - you@example.com
        notify:
          success: true
          failure: true
      # Optional: push the APK to a Google Drive folder or external artifact store.
      # See https://docs.codemagic.io/yaml-publishing/google-play/ for Play Store integration.
