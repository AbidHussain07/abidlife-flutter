workflows:
  android-debug:
    name: ABIDLIFE Android Debug
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Generate launcher icons
        script: dart run flutter_launcher_icons
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
      - flutter_drive.log

  android-release:
    name: ABIDLIFE Android Release
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      groups:
        - android-signing
      vars:
        PACKAGE_NAME: com.abidlife.app
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Generate launcher icons
        script: dart run flutter_launcher_icons
      - name: Configure signing when credentials exist
        script: |
          if [ -n "$CM_KEYSTORE" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/android/app/abidlife-keystore.jks"
            cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=abidlife-keystore.jks
          EOF
          fi
      - name: Analyze and test
        script: |
          flutter analyze
          flutter test
      - name: Build release APK and app bundle
        script: |
          flutter build apk --release
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
