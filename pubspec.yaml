name: abidlife
description: "ABIDLIFE — Notes, Tasks, Habits & Money. Everything you need, in one place. A calm, beautiful home for your notes, tasks, habits and money."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local storage
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.2

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.1

  # UI
  lucide_icons: ^0.257.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Features
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  image_picker: ^1.1.2
  flutter_markdown: ^0.7.4+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon.svg
