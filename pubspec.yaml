name: abidlife
description: A calm, offline-first home for notes, tasks, habits and money.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6
  cryptography: ^2.7.0
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_quill: ^11.5.0
  flutter_quill_extensions: ^11.0.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/app_icon_foreground.png
  adaptive_icon_background: "#6E5BFF"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
  min_sdk_android: 23
